<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>バッカニアファンタジー　国の歴史の10問テスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cinzel:wght@600;700&display=swap');

  :root{
    --paper:#ece0c4;
    --ink:#2b2218;
    --ink-soft:#5b4a36;
    --gold:#a9842f;
    --gold-bright:#c9a23f;
    --green:#2f5d3a;
    --red:#7a2b2b;
    --blue:#27395f;
    --brown:#5f4a23;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    --radius:6px;
    --tap:52px;
  }

  *, *::before, *::after { box-sizing:border-box; }

  html {
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:radial-gradient(ellipse at top, #2a2117 0%, #15110c 70%);
    font-family:'Shippori Mincho', serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:16px 12px 32px;
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  .stage{ width:100%; max-width:600px; }

  .frame{
    position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.04)),var(--paper);
    border:1px solid var(--gold);
    border-radius:var(--radius);
    box-shadow:var(--shadow),inset 0 0 50px rgba(80,60,20,.15);
    padding:24px 18px 22px;
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(169,132,47,.4);
    border-radius:calc(var(--radius) - 1px);
    pointer-events:none;
  }

  /* === TYPOGRAPHY === */
  .eyebrow{
    font-family:'Cinzel',serif;
    letter-spacing:.2em;
    font-size:10px;
    color:var(--gold);
    text-align:center;
    margin-bottom:4px;
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:700;
    text-align:center;
    font-size:20px;
    letter-spacing:.03em;
    margin:0 0 4px;
    color:var(--ink);
    line-height:1.3;
  }
  .subtitle{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    margin-bottom:18px;
    line-height:1.6;
  }

  /* === START SCREEN === */
  .start-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:14px 0 16px;
  }
  .nation-card{
    border:1px solid var(--gold);
    border-radius:var(--radius);
    padding:0 14px;
    min-height:var(--tap);
    background:rgba(255,255,255,.22);
    font-size:13px;
    font-family:'Shippori Mincho',serif;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    line-height:1.4;
    word-break:break-word;
    overflow-wrap:break-word;
    -webkit-appearance:none;
    transition:background .1s;
  }
  .nation-card:active{ background:rgba(255,255,255,.55); transform:scale(.98); }

  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .dot.green{ background:var(--green); }
  .dot.red  { background:var(--red); }
  .dot.blue { background:var(--blue); }
  .dot.brown{ background:var(--brown); }

  .start-desc{
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.7;
    margin-bottom:4px;
    text-align:center;
  }

  /* === BUTTONS === */
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:var(--tap);
    font-family:'Cinzel',serif;
    letter-spacing:.07em;
    font-size:14px;
    padding:0 20px;
    border:1px solid var(--ink);
    border-radius:var(--radius);
    background:linear-gradient(180deg,#3a2f20,#221a10);
    color:var(--paper);
    cursor:pointer;
    -webkit-appearance:none;
    transition:opacity .1s;
  }
  .btn:active{ opacity:.72; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* === QUIZ SCREEN === */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-size:12px;
    color:var(--ink-soft);
    gap:10px;
  }
  .q-num{ white-space:nowrap; font-weight:700; }
  .q-sc { white-space:nowrap; }

  .progress-track{
    flex:1;
    height:6px;
    background:rgba(0,0,0,.15);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));
    width:0%;
    transition:width .35s ease;
  }

  .tag{
    display:inline-block;
    font-family:'Cinzel',serif;
    font-size:9px;
    letter-spacing:.1em;
    padding:4px 12px;
    border-radius:999px;
    color:#fff;
    margin-bottom:12px;
  }
  .tag.green{ background:var(--green); }
  .tag.red  { background:var(--red); }
  .tag.blue { background:var(--blue); }
  .tag.brown{ background:var(--brown); }

  .question{
    font-size:16px;
    line-height:1.8;
    margin:0 0 14px;
    color:var(--ink);
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:14px;
  }
  .choice{
    display:flex;
    align-items:center;
    text-align:left;
    font-family:'Shippori Mincho',serif;
    font-size:14px;
    min-height:var(--tap);
    padding:12px 14px;
    border:1px solid var(--ink-soft);
    border-radius:var(--radius);
    background:rgba(255,255,255,.35);
    cursor:pointer;
    color:var(--ink);
    line-height:1.6;
    word-break:break-all;
    overflow-wrap:break-word;
    white-space:normal;
    -webkit-appearance:none;
    transition:background .1s;
  }
  .choice:active{ background:rgba(255,255,255,.65); }
  .choice.correct{ background:rgba(47,93,58,.2); border-color:var(--green); font-weight:700; }
  .choice.wrong  { background:rgba(122,43,43,.2); border-color:var(--red); }
  .choice[disabled]{ cursor:default; }

  .explain{
    font-size:13px;
    line-height:1.8;
    color:var(--ink-soft);
    border-left:3px solid var(--gold);
    padding:12px 14px;
    background:rgba(255,255,255,.3);
    border-radius:0 var(--radius) var(--radius) 0;
    margin-bottom:16px;
    display:none;
  }

  .nav{ display:flex; justify-content:flex-end; }
  .nav .btn{ width:auto; min-width:120px; padding:0 28px; }

  /* === RESULT SCREEN === */
  .result-score{ text-align:center; margin:12px 0 6px; }
  .result-score .big{
    font-family:'Cinzel',serif;
    font-size:56px;
    color:var(--gold);
    line-height:1;
  }
  .result-score .of{ font-size:16px; color:var(--ink-soft); }
  .rank{
    text-align:center;
    font-size:14px;
    margin-bottom:18px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .review-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
    max-height:42vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .review-item{
    font-size:12px;
    line-height:1.65;
    padding:10px 12px;
    border-radius:var(--radius);
    border-left:3px solid var(--ink-soft);
    background:rgba(255,255,255,.3);
  }
  .review-item.ok{ border-color:var(--green); }
  .review-item.ng{ border-color:var(--red); }
  .review-item b { display:block; margin-bottom:3px; font-size:11px; }

  .hidden{ display:none !important; }

  /* === 小画面 (〜360px) === */
  @media (max-width:360px){
    .start-grid{ grid-template-columns:1fr; }
    h1{ font-size:18px; }
    .question{ font-size:15px; }
    .choice{ font-size:13px; }
    .frame{ padding:20px 14px 18px; }
  }

  /* === デスクトップ拡張 (560px〜) === */
  @media (min-width:560px){
    .frame{ padding:36px 32px 30px; }
    h1{ font-size:26px; }
    .question{ font-size:18px; }
    .choice{ font-size:15px; }
    .nation-card{ font-size:14px; }
    .tag{ font-size:10px; }
  }

  /* ホバー効果はマウス操作時のみ */
  @media (hover:hover){
    .nation-card:hover{ background:rgba(255,255,255,.55); transform:translateY(-1px); box-shadow:0 6px 14px rgba(0,0,0,.22); }
    .btn:hover{ opacity:.88; box-shadow:0 6px 14px rgba(0,0,0,.3); }
    .choice:hover{ background:rgba(255,255,255,.6); }
  }

  ::-webkit-scrollbar{ width:4px; }
  ::-webkit-scrollbar-thumb{ background:var(--gold); border-radius:3px; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">

    <!-- START -->
    <div id="screen-start">
      <div class="eyebrow">THE BUCCANEER FANTASY</div>
      <h1>国の歴史の<br>10問テスト</h1>
      <div class="subtitle">挑戦する国を選んでください(毎回ランダム10問)</div>

      <div class="start-grid" id="nation-select">
        <button class="nation-card nation-btn" data-nation="green" onclick="startQuiz('green')">
          <span class="dot green"></span>カークオウル共和国
        </button>
        <button class="nation-card nation-btn" data-nation="red" onclick="startQuiz('red')">
          <span class="dot red"></span>ヴァルガロ王国
        </button>
        <button class="nation-card nation-btn" data-nation="blue" onclick="startQuiz('blue')">
          <span class="dot blue"></span>クルージョワ公国
        </button>
        <button class="nation-card nation-btn" data-nation="brown" onclick="startQuiz('brown')">
          <span class="dot brown"></span>デルベザイオン国
        </button>
      </div>

      <p class="start-desc">
        選んだ国の全22問の中からランダムで10問出題されます。何度挑戦しても毎回異なる問題が出題されます。満点を目指して称号を獲得しましょう！
      </p>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="hidden">
      <div class="topbar">
        <span id="q-counter" class="q-num">Q1 / 10</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span id="q-score" class="q-sc">SCORE 0</span>
      </div>

      <span class="tag" id="q-tag">TAG</span>
      <p class="question" id="q-text">問題文</p>

      <div class="choices" id="q-choices"></div>

      <div class="explain" id="q-explain"></div>

      <div class="nav">
        <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>次へ</button>
      </div>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="hidden">
      <div class="eyebrow">RESULT</div>
      <h1>結果発表</h1>
      <div style="text-align:center;margin-bottom:6px;">
        <span class="tag" id="result-tag">国名</span>
      </div>
      <div class="result-score">
        <span class="big" id="final-score">0</span>
        <span class="of"> / 10</span>
      </div>
      <div class="rank" id="rank-text"></div>

      <div id="result-datetime" style="text-align:center;margin-bottom:16px;font-size:13px;color:var(--ink-soft);line-height:1.8;"></div>

      <div class="review-list" id="review-list"></div>
    </div>

  </div>
</div>

<script>
const QUESTIONS = [
  // =================== カークオウル共和国 (green) ===================
  {
    nation: "green", nationName: "カークオウル共和国", category: "現代史",
    q: "ルワンポル大森林の妖精が作る調味料「森羅万塩油」は、木の実油を壺に入れて何年寝かせたものか?",
    choices: ["5年", "10年", "20年"], correct: 1,
    explain: "正解は「10年」。木の実油を壺に入れ10年間寝かせて作られる、妖精が作る調味料です。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "現代史",
    q: "ハイデル地方が乾燥地でありながら国内屈指の生産量を誇る食材は?",
    choices: ["キノコ", "香辛料", "果実"], correct: 0,
    explain: "正解は「キノコ」。乾燥し荒れた土地ながら、種類と生産量は国内でも屈指で他国にも輸出されています。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "現代史",
    q: "ハイデル地方に生息し、旅人の荷物を盗んで巣に持ち帰る習性を持つ生き物は?",
    choices: ["ハイデルリス", "ワポウン", "オオウサネコ"], correct: 0,
    explain: "正解は「ハイデルリス」。知能が高く、人間の荷物に価値はないが巣の外に山積みにする習性があります。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "現代史",
    q: "元々はデルベザイオン国で飼育されていたが、現在はガリアピス島全域で飼育されている繁殖力の高い鳥は?",
    choices: ["コカトリス", "フェニックス鶏", "シルレの神竜"], correct: 1,
    explain: "正解は「フェニックス鶏」。不死鳥のような尾を持つが不死の力はなく、繁殖力はもはや不死に近いとされます。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "現代史",
    q: "カークオウル共和国の広大な森の移動手段として使われる、ゴンドラのついた巨大な生物は?",
    choices: ["ワポウン(オオウサネコ)", "ハイデルリス", "ぐるぐるどん"], correct: 0,
    explain: "正解は「ワポウン(オオウサネコ)」。ルワンポル大森林の移動に使われ、戦時中は機動戦車としても運用されました。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史1(100年前)",
    q: "カークオウル共和国を建国したハミル族の族長の名前は?",
    choices: ["スー・トワリ", "ハミル・カーディシアン", "テルン・ル・クルージョワ"], correct: 1,
    explain: "正解は「ハミル・カーディシアン」。レテ歴882年、5部族を武力を使わず統合し共和制の国を建国しました。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史1(100年前)",
    q: "カークオウル共和国の国旗にある5本の矢が象徴するものは?",
    choices: ["5つの部族の協力関係", "5人の英雄", "5つの聖地"], correct: 0,
    explain: "正解は「5つの部族の協力関係」。国旗の五本の矢は5つの部族が同じ方向を向き協力し合うという誓約を意味します。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史1(100年前)",
    q: "カークオウル共和国建国後に始まった「ハミルの祭り」で祀られる神は?",
    choices: ["不死鳥", "猫神", "一角獣"], correct: 1,
    explain: "正解は「猫神」。どこにでもいる普通の猫が神として愛でられ甘やかされる祭りで、後年は”猫派か犬派か”論争の火種にもなりました。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史1(100年前)",
    q: "かつてヴァルガロ軍との最前線として激戦が繰り広げられ、満月の夜にポルポル獣人族の大暴走が起きた地は?",
    choices: ["東月影の丘", "静寂の地ナダ", "三本杉の池跡"], correct: 0,
    explain: "正解は「東月影の丘」。満月の夜に起きたポルポル獣人族の大暴走により、敵も味方も誰一人立っていなかったという。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史2(200年以上前)",
    q: "千年前の戦乱で幹の上部が焼け落ちたとされる、ルワンポルの民が守り続ける神樹は?",
    choices: ["ユグドラシル", "ワルドラシル", "アルマデル"], correct: 0,
    explain: "正解は「ユグドラシル」。当時聞こえたとされる精霊の声は、今では聞こえなくなったと伝わります。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史2(200年以上前)",
    q: "モルモル・コルコル・ポルポルの三部族が一つの大部族だった戦乱の時代に誕生した料理は?",
    choices: ["トーフ", "ピザ", "ソーセージ"], correct: 1,
    explain: "正解は「ピザ」。短時間で高い栄養を補給できることから当時の戦士たちに好まれていました。"
  },
  {
    nation: "green", nationName: "カークオウル共和国", category: "歴史2(200年以上前)",
    q: "樹齢5000年を超える大木の足元にあり、かつて傷を癒す池があったとされる場所は?",
    choices: ["三本杉の池跡", "霊峰シルレ", "シルレ山脈"], correct: 0,
    explain: "正解は「三本杉の池跡」。あらゆる傷を癒し呪いすらも浄化する特別な池があったと伝わります。"
  },

  // =================== ヴァルガロ王国 (red) ===================
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "現代史",
    q: "ヴァルガロ王国のルガドラ山脈全域で収穫される、辛い調味料として使われる食材は?",
    choices: ["紅蓮の実", "ナダの果実", "マンドラベリー"], correct: 0,
    explain: "正解は「紅蓮の実」。古くから食べられている一般的な辛味食材です。"
  },
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "現代史",
    q: "貿易都市ブーカンの人気店「食事処ヴァルヴァリア」の名物料理に使われる、作り方が門外不出の味噌は?",
    choices: ["紅蓮味噌", "黒炎味噌", "魔石味噌"], correct: 1,
    explain: "正解は「黒炎味噌」。巨大な壺で大量に作られ、その製法は秘匿情報とされています。"
  },
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "現代史",
    q: "ヴァルガロ王国の英傑たちが持つ、一年間にわたり国民が食べる味を選べる権利の対象となる食材は?",
    choices: ["ポテ芋", "肉", "香辛料"], correct: 0,
    explain: "正解は「ポテ芋」。王ともなれば後世に渡りその味を決められたとされています。"
  },
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "現代史",
    q: "ヴァルガロ王国で王が決定する方法として根付いている文化は?",
    choices: ["世襲制", "議会選挙", "実力主義(力こそ全て)"], correct: 2,
    explain: "正解は「実力主義」。家系や血筋ではなく、優れた英傑同士が戦い合い選出されます。"
  },
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "現代史",
    q: "ヴァルガロ魔石鉱で目撃される悪戯好きの精霊「トントタン」の悪戯として誤っているものは?",
    choices: ["採掘した魔石を石ころと入れ替える", "鉱山内の地図を書き換える", "旅人の荷物を盗んで巣に持ち帰る"], correct: 2,
    explain: "正解は「旅人の荷物を盗んで巣に持ち帰る」。これはハイデルリス(カークオウル)の習性であり、トントタンの悪戯ではありません。"
  },
  {
    nation: "red", nationName: "ヴァルガロ王国", category: "歴史1(100年前)",
    q: "百年前の革命期にヴァルガロ王国が廃止し、民主制へ移行した制度は?",
    choices: ["王制", "鉱業権", "通商権"], correct: 0,
    explain: "正解は「王制」。同時に武装解除と開国を行い、近代国家への歩みを進めました。"

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(nation){
  selectedNation = nation;
  // 元問題 + 追加問題を合わせた国別プールをシャッフルして先頭10問を使用
  const all = [...QUESTIONS, ...EXTRA_QUESTIONS].filter(q => q.nation === nation);
  sessionPool = shuffle(all).slice(0, QUIZ_COUNT);
  current = 0;
  score = 0;
  answers = [];
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  const item = sessionPool[current];

  document.getElementById('q-counter').textContent = `Q${current+1} / ${QUIZ_COUNT}`;
  document.getElementById('q-score').textContent = `SCORE ${score}`;
  document.getElementById('progress-fill').style.width = `${(current/QUIZ_COUNT)*100}%`;

  const tag = document.getElementById('q-tag');
  tag.textContent = `${item.nationName} ／ ${item.category}`;
  tag.className = `tag ${item.nation}`;

  document.getElementById('q-text').textContent = item.q;

  const choicesEl = document.getElementById('q-choices');
  choicesEl.innerHTML = '';
  const choiceOrder = shuffle(item.choices.map((_,i)=>i));

  choiceOrder.forEach(origIdx => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = item.choices[origIdx];
    btn.onclick = () => selectChoice(origIdx, btn);
    choicesEl.appendChild(btn);
  });

  document.getElementById('q-explain').style.display = 'none';
  document.getElementById('q-explain').textContent = '';
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn').textContent = (current === QUIZ_COUNT-1) ? '結果を見る' : '次へ';
}

function selectChoice(origIdx, btnEl){
  const item = sessionPool[current];
  const allBtns = document.querySelectorAll('#q-choices .choice');
  if(allBtns[0].disabled) return;

  const isCorrect = origIdx === item.correct;
  allBtns.forEach(b => {
    b.disabled = true;
    if(b.textContent === item.choices[item.correct]) b.classList.add('correct');
  });
  if(!isCorrect) btnEl.classList.add('wrong');
  if(isCorrect) score++;

  answers.push({
    nationName: item.nationName, category: item.category, q: item.q,
    picked: item.choices[origIdx], correctText: item.choices[item.correct],
    isCorrect: isCorrect
  });

  document.getElementById('q-explain').textContent = item.explain;
  document.getElementById('q-explain').style.display = 'block';
  document.getElementById('q-score').textContent = `SCORE ${score}`;
  document.getElementById('next-btn').disabled = false;
}

function nextQuestion(){
  current++;
  if(current >= QUIZ_COUNT){
    showResult();
  } else {
    renderQuestion();
  }
}

function getRank(nation, score){
  const ranks = NATION_RANKS[nation];
  for(const r of ranks){
    if(score >= r.min) return r.title;
  }
  return ranks[ranks.length-1].title;
}

function showResult(){
  document.getElementById('progress-fill').style.width = `100%`;
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  document.getElementById('final-score').textContent = score;

  const resultTag = document.getElementById('result-tag');
  resultTag.textContent = NATION_LABEL[selectedNation];
  resultTag.className = `tag ${selectedNation}`;

  const rank = getRank(selectedNation, score);
  document.getElementById('rank-text').textContent = `称号:「${rank}」`;

  const list = document.getElementById('review-list');
  list.innerHTML = '';
  answers.forEach(a => {
    const div = document.createElement('div');
    div.className = `review-item ${a.isCorrect ? 'ok' : 'ng'}`;
    div.innerHTML = `<b>${a.nationName} ／ ${a.category} ${a.isCorrect ? '○' : '×'}</b>
      ${a.q}<br>
      あなたの回答:${a.picked}${a.isCorrect ? '' : ` ／ 正解:${a.correctText}`}`;
    list.appendChild(div);
  });

  document.getElementById('result-datetime').innerHTML =
    `テスト終了時刻<br><strong>${formatDateTime()}</strong>`;
}

function restartQuiz(){
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}

function formatDateTime(){
  const now = new Date();
  const y = now.getFullYear();
  const mo = String(now.getMonth()+1).padStart(2,'0');
  const d  = String(now.getDate()).padStart(2,'0');
  const h  = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  const s  = String(now.getSeconds()).padStart(2,'0');
  const week = ['日','月','火','水','木','金','土'][now.getDay()];
  return `${y}年${mo}月${d}日（${week}）${h}:${mi}:${s}`;
}
